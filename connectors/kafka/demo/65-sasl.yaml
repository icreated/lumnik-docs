# 65-sasl.yaml — SASL/PLAIN credentials, by name.
#
# Neither the username nor the password is in this file: `username_env` and `password_env`
# name secrets (`lm secret set ACME_KAFKA_USER`, `lm secret set ACME_KAFKA_PW`).
# `security_protocol`: SASL_SSL (the default), or SASL_PLAINTEXT for a broker without TLS.
#
# The demo broker authenticates nobody, so this manifest cannot complete against it. It shows
# two refusals: an unresolved secret name, before any connection; a broker that speaks no SASL,
# after.

apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: acme-kafka-sasl
  connector_type: kafka
  scopes: [billing]

spec:
  name: acme_partners_sasl
  # The hub runs in Docker: `localhost` there is the hub's own container, not your machine.
  brokers: host.docker.internal:29092
  topic: acme.partners
  format: json
  auth:
    kind: sasl-plain
    security_protocol: SASL_PLAINTEXT
    username_env: ACME_KAFKA_USER
    password_env: ACME_KAFKA_PW
