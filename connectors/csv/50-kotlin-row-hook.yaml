# 50-kotlin-row-hook.yaml — Kotlin escape hatch: a cell hook normalizes the legacy
# date format during ingestion so the hub stores clean ISO-8601 values.
#
# Apply and run:
#   lm apply -f docs/connectors/csv/50-kotlin-row-hook.yaml
#   lm connector run csv-kotlin-hook
#
# The hook rewrites every signup_date cell from the source format "DD/MM/YYYY"
# to "YYYY-MM-DD" before the row is written to the hub table.  The transformation
# is idempotent — rows that already carry ISO dates pass through unchanged.
#
# Where a script comes from
# -------------------------
# A manifest never carries a script, nor a path to one: it NAMES a script the hub already has.
#   script: hooks:<name>.kts   — a file the operator put in the hub's hooks directory
#                                (docs/deploy.md, "Offer Kotlin scripts to the integrators")
#   script: classpath:<path>   — a script built into the hub
# A script runs with all of the hub's rights, so only the operator installs one. This example
# uses the sample shipped with the platform (hooks/samples/normalize-date.kts); its readable
# source is also mirrored at docs/connectors/csv/hooks/normalize-date.kts for documentation.
#
# KotlinScriptHost binding contract
# ----------------------------------
# The host injects two top-level bindings into the script:
#   bindings["cells"]   — MutableMap<String, Any?> — the current row's columns; mutate in-place.
#   bindings["context"] — Map<String, Any?>          — a copy of the hook's own params.context values from
#                          the manifest (e.g. `context: { defaultCountry: FR }` under the hook), with
#                          their YAML types (text, number, boolean, list, map); rebuilt per row, so a
#                          mutation reaches nothing — treat it as read-only.
# Changes to "cells" are visible to subsequent hooks in the chain and to the sink writer.

apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: csv-kotlin-hook           # unique connector name within the workspace
  connector_type: csv-file
  scopes: [demo]

spec:
  transport:
    kind: local
    path: docs/connectors/csv/data/customers.csv

  parser:
    has_header: true

  after_process: none

  mapping:
    cell:
      - kotlin:
          script: classpath:hooks/samples/normalize-date.kts   # built in (see header)
          # The script receives the mutable 'cells' map.  Any column value may be
          # read or overwritten; rows are not filtered (return nothing — the sink
          # always writes the row).
