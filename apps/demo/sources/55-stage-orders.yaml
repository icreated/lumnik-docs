# 55-stage-orders.yaml — the order lines, each stamped ORDERED (for conflicts: false on the Entities page).

apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: stage-orders
  connector_type: csv-file
  scopes: [desk]

spec:
  transport:
    kind: local
    path: /tmp/acme-desk/stage-orders.csv
  parser:
    has_header: true
  after_process: none
