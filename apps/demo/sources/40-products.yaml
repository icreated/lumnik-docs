# 40-products.yaml — the product master, one row per product.
#
# Lands connector.t_products. `m_product_category_id` references the category table
# (50-product-categories.yaml); the Entity 30-product-with-category.yaml joins it.

apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: products
  connector_type: csv-file
  scopes: [catalogue]

spec:
  transport:
    kind: local
    path: /tmp/acme-catalogue/m_product.csv   # on the HUB's filesystem — see entities.md for the docker cp
  parser:
    has_header: true
  after_process: none
