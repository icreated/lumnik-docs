# 40-rest-review.yaml — a workflow on a REST connector's table (ext.*).
#
# Watched like an ingest table; a key's versions are ordered by `indexed_at`, the moment the row last changed.
apiVersion: apps.lumnik.io/v1
kind: Workflow
metadata:
  name: lab-result-review
spec:
  scope: lab
  provenance: declared
  on:
    table: ext.lab_results
    column: review_state
    key: sample
  dormancy:
    after: 7d
  states:
    - { code: to_be_verified, initial: true }
    - { code: verified, terminal: true }
  transitions:
    - { from: [to_be_verified], to: verified }
