# 64-refused-quoted-value.yaml — must be refused at apply. A clean apply on this file is the defect.
#
# The rule: a value in the filter grammar is a BARE literal. Quotes are ordinary characters here,
# so `status='EN LITIGE'` would be compared to the column quotes and all — a condition that can
# never be true, accepted at apply and silent for ever (icreated/lumnik#503).
apiVersion: apps.lumnik.io/v1
kind: Process
metadata:
  name: refused-quoted
spec:
  scope: desk
  on:
    event: data.row.changed
    table: connector.t_acme_desk_orders
  when:
    - status='EN LITIGE'
  emit:
    type: decision.litige-quote
    message: "Commande {order_no} en litige"
